<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliminar Producto - Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-large">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html"
            ><i class="fas fa-store me-2"></i>PZDREAM</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="menuAdmin.html"
                  ><i class="fas fa-user-shield"></i> Panel</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="menuEliminar.html"
                  ><i class="fas fa-trash"></i> Eliminar</a
                >
              </li>
            </ul>
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link text-danger" href="index.html" id="logoutAdminBtn"
                  ><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="main-content container my-5">
      <div class="admin-header">
        <h1>
          <i class="fas fa-trash-alt me-2 text-danger"></i>Eliminar Producto
        </h1>
        <p>Selecciona un producto para eliminarlo permanentemente</p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <form id="eliminarForm" class="admin-form">
                <div class="mb-3">
                  <label for="productoSelect" class="form-label"
                    >Selecciona el producto</label
                  >
                  <select class="form-select" id="productoSelect" required>
                    <option value="">-- Seleccionar --</option>
                  </select>
                </div>
                <div id="mensajeContainer"></div>
                <button type="submit" class="btn btn-danger">
                  <i class="fas fa-trash me-2"></i>Eliminar producto
                </button>
                <a href="menuAdmin.html" class="btn btn-outline-secondary"
                  ><i class="fas fa-arrow-left me-2"></i>Cancelar</a
                >
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="row">
          <div class="col-md-4 mb-3">
            <h5 class="footer-title">
              <i class="fas fa-store me-2"></i>PZDREAM
            </h5>
            <p class="footer-text">Panel de administración.</p>
          </div>
          <div class="col-md-4 mb-3">
            <h6 class="footer-title">Enlaces</h6>
            <ul class="footer-links">
              <li><a href="index.html">Inicio</a></li>
              <li><a href="catalogo.html">Catálogo</a></li>
            </ul>
          </div>
          <div class="col-md-4 mb-3">
            <h6 class="footer-title">Contacto</h6>
            <ul class="footer-links">
              <li><i class="fas fa-envelope me-2"></i>admin@pzdream.cl</li>
            </ul>
          </div>
        </div>
        <div class="footer-bottom">
          <p class="mb-0 text-center">
            &copy; 2026 <strong>PZDREAM</strong> - Todos los derechos
            reservados.
          </p>
        </div>
      </div>
    </footer>

    <scrip src="js/admin.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
