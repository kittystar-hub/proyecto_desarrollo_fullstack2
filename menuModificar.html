<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modificar Producto - Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-large">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html"
            ><i class="fas fa-store me-2"></i>PZDREAM</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="menuAdmin.html"
                  ><i class="fas fa-user-shield"></i> Panel</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="menuModificar.html"
                  ><i class="fas fa-edit"></i> Modificar</a
                >
              </li>
            </ul>
            <ul class="navbar-nav">
              <li class="nav-item">
                <a
                  class="nav-link text-danger"
                  href="index.html"
                  id="logoutAdminBtn"
                  ><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="main-content container my-5">
      <div class="admin-header">
        <h1><i class="fas fa-edit me-2 text-warning"></i>Modificar Producto</h1>
        <p>Selecciona un producto y actualiza sus datos</p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="mb-4">
                <label for="productoSelectMod" class="form-label fw-semibold"
                  >Seleccionar producto</label
                >
                <select class="form-select" id="productoSelectMod">
                  <option value="">-- Seleccionar --</option>
                </select>
              </div>

              <form id="modificarForm" class="admin-form" style="display: none">
                <input type="hidden" id="productoId" />
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="modNombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="modNombre" />
                  </div>
                  <div class="col-md-6">
                    <label for="modPrecio" class="form-label"
                      >Precio (CLP)</label
                    >
                    <input type="number" class="form-control" id="modPrecio" />
                  </div>
                  <div class="col-md-6">
                    <label for="modStock" class="form-label">Stock</label>
                    <input type="number" class="form-control" id="modStock" />
                  </div>
                  <div class="col-md-6">
                    <label for="modCategoria" class="form-label"
                      >Categoría</label
                    >
                    <select class="form-select" id="modCategoria">
                      <option value="general">General</option>
                      <option value="gamer">Gamer</option>
                      <option value="oficina">Oficina</option>
                      <option value="componentes">Componentes</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label for="modImagen" class="form-label">URL imagen</label>
                    <input type="text" class="form-control" id="modImagen" />
                  </div>
                  <div class="col-12">
                    <label for="modDescripcion" class="form-label"
                      >Descripción</label
                    >
                    <textarea
                      class="form-control"
                      id="modDescripcion"
                      rows="3"
                    ></textarea>
                  </div>
                </div>
                <div id="mensajeContainer" class="mt-3"></div>
                <div class="d-flex gap-2 mt-4">
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Guardar cambios
                  </button>
                  <a href="menuAdmin.html" class="btn btn-outline-secondary"
                    ><i class="fas fa-arrow-left me-2"></i>Cancelar</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="row">
          <div class="col-md-4 mb-3">
            <h5 class="footer-title">
              <i class="fas fa-store me-2"></i>PZDREAM
            </h5>
            <p class="footer-text">Panel de administración.</p>
          </div>
          <div class="col-md-4 mb-3">
            <h6 class="footer-title">Enlaces</h6>
            <ul class="footer-links">
              <li><a href="index.html">Inicio</a></li>
              <li><a href="catalogo.html">Catálogo</a></li>
            </ul>
          </div>
          <div class="col-md-4 mb-3">
            <h6 class="footer-title">Contacto</h6>
            <ul class="footer-links">
              <li><i class="fas fa-envelope me-2"></i>admin@pzdream.cl</li>
            </ul>
          </div>
        </div>
        <div class="footer-bottom">
          <p class="mb-0 text-center">
            &copy; 2026 <strong>PZDREAM</strong> - Todos los derechos
            reservados.
          </p>
        </div>
      </div>
    </footer>

    <script src="js/admin.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
