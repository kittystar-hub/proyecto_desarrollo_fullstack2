<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - PZDREAM</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-large">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html"
            ><i class="fas fa-store me-2"></i>PZDREAM</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html"
                  ><i class="fas fa-home"></i> Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="catalogo.html"
                  ><i class="fas fa-th-large"></i> Catálogo</a
                >
              </li>
            </ul>
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="login.html"
                  ><i class="fas fa-sign-in-alt"></i> Clientes</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main
      class="main-content d-flex align-items-center justify-content-center"
      style="min-height: 60vh"
    >
      <div class="login-card" style="max-width: 420px; width: 100%">
        <div class="logo text-center mb-4">
          <i class="fas fa-user-shield fa-3x text-primary"></i>
          <h2 class="mt-2">Panel Admin</h2>
          <p class="text-muted">Ingresa tus credenciales</p>
        </div>
        <form id="loginAdminForm">
          <div class="mb-3">
            <label for="nombreAdmin" class="form-label fw-semibold"
              >Usuario</label
            >
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input
                type="text"
                class="form-control"
                id="nombreAdmin"
                placeholder="admin"
                value="admin"
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="keys" class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="keys"
                placeholder="••••••••"
                value="admin123"
              />
            </div>
          </div>
          <div id="mensajeContainer"></div>
          <button type="submit" class="btn btn-login w-100 mt-2">
            <i class="fas fa-sign-in-alt me-2"></i>Iniciar sesión
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="index.html" class="text-muted"
            ><i class="fas fa-arrow-left me-1"></i>Volver al inicio</a
          >
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="row">
          <div class="col-md-4 mb-3">
            <h5 class="footer-title">
              <i class="fas fa-store me-2"></i>PZDREAM
            </h5>
            <p class="footer-text">Tu tienda de tecnología favorita.</p>
          </div>
          <div class="col-md-4 mb-3">
            <h6 class="footer-title">Enlaces</h6>
            <ul class="footer-links">
              <li><a href="index.html">Inicio</a></li>
              <li><a href="catalogo.html">Catálogo</a></li>
            </ul>
          </div>
          <div class="col-md-4 mb-3">
            <h6 class="footer-title">Contacto</h6>
            <ul class="footer-links">
              <li><i class="fas fa-envelope me-2"></i>admin@pzdream.cl</li>
            </ul>
          </div>
        </div>
        <div class="footer-bottom">
          <p class="mb-0 text-center">
            &copy; 2026 <strong>PZDREAM</strong> - Todos los derechos
            reservados.
          </p>
        </div>
      </div>
    </footer>

    <script src="script/log.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
