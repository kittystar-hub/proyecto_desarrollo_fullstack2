<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Iniciar Sesión - PZDREAM</title>
    <meta name="description" content="Inicia sesión en PZDREAM" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CSS EXTERNO GENERAL -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- CSS EXTERNO ESPECÍFICO DEL LOGIN -->
    <link rel="stylesheet" href="css/login.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-large">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
            <i class="fas fa-store me-2"></i>PZDREAM
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html">
                  <i class="fas fa-home me-1"></i>Inicio
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">
                  <i class="fas fa-box me-1"></i>Productos
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">
                  <i class="fas fa-info-circle me-1"></i>Nosotros
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">
                  <i class="fas fa-envelope me-1"></i>Contacto
                </a>
              </li>
            </ul>
            <ul class="navbar-nav mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="login.html">
                  <i class="fas fa-sign-in-alt me-1"></i>Iniciar sesión
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <div class="login-card">
        <div class="logo">
          <i class="fas fa-user-circle"></i>
          <h2>Bienvenido</h2>
          <p class="text-muted">Inicia sesión en tu cuenta</p>
        </div>

        <form action="#" method="POST">
          <!-- Correo -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold"
              >Correo electrónico</label
            >
            <div class="input-group">
              <span class="input-group-text"
                ><i class="fas fa-envelope"></i
              ></span>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>
          </div>

          <!-- Contraseña -->
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold"
              >Contraseña</label
            >
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <!-- Olvidó contraseña -->
          <div class="forgot-link">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón de inicio de sesión -->
          <button type="submit" class="btn btn-login">
            <i class="fas fa-sign-in-alt me-2"></i>Iniciar sesión
          </button>
        </form>

        <!-- Enlace a registro -->
        <div class="register-link">
          ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
        </div>

        <!-- Enlace de vuelta al inicio -->
        <div class="back-home">
          <a href="index.html"
            ><i class="fas fa-arrow-left me-1"></i>Volver al inicio</a
          >
        </div>
      </div>
    </main>

    <script src="script/script.js" async defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
